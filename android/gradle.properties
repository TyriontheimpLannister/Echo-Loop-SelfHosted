org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# [自用补丁] 项目在 D: 盘、pub 缓存在 C: 盘，Kotlin 增量编译的 PersistentHashMap
# 无法跨盘符(C:\ vs D:\)计算相对路径 → 报 "different roots" 且 daemon 编译失败。
# 关闭 Kotlin 增量编译可绕过该跨盘缓存写入；同时关掉 Gradle 文件监视器跨盘问题。
kotlin.incremental=false
org.gradle.unsafe.watch-fs=false
# [自用补丁] AAPT2 daemon 模式在 Windows 上 spawn 子进程偶发 "Daemon startup failed"
# （报错提示"检查 Windows Universal C Runtime"是误导，aapt2.exe 本身可正常运行）。
# 关闭 daemon 模式，让 aapt2 进程内编译，规避该问题。
# 注意：AGP 8.9.1 读取的属性名是 android.enableAapt2Daemon（不是 aapt2DaemonMode，
# 后者是其他 AGP 版本的写法，已确认不在本版 jar 中，设了会被忽略）。
android.enableAapt2Daemon=false
systemProp.android.enableAapt2Daemon=false
